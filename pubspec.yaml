name: hud_overlay
description: >-
  A state-management-agnostic, accessibility-first, context-optional Flutter
  loading overlay. Works in widget trees, BLoC, Riverpod, and service layers
  with zero boilerplate.
version: 0.1.0
homepage: https://github.com/uzairaslam/hud_overlay
repository: https://github.com/uzairaslam/hud_overlay
issue_tracker: https://github.com/uzairaslam/hud_overlay/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # no platform-specific code needed
